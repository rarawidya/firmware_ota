<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>STM32 OTA - Settings</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{
      --primary:#19c37d;
      --primary-dark:#12a164;
      --primary-soft:#d9fbe9;
      --border:#d1d5db;
      --bg:#e5e7eb;
      --card-bg:rgba(255,255,255,0.86);
      --text:#0f172a;
      --muted:#6b7280;
      --danger:#ef4444;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top left,#e0fbea 0,#e0f2fe 40%,#e5e7eb 100%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 12px;
    }

    .card{
      width:100%;
      max-width:780px;
      background:var(--card-bg);
      border-radius:26px;
      box-shadow:
        0 28px 80px rgba(15,23,42,0.35),
        0 0 0 1px rgba(148,163,184,0.35);
      padding:26px 26px 22px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius:14px;
      padding:4px;
      background:radial-gradient(circle at 30% 20%,#bbf7d0,#16a34a);
      box-shadow:
        0 10px 24px rgba(22,163,74,0.45),
        0 0 0 1px rgba(22,163,74,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo svg{
      width:30px;
      height:30px;
      display:block;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title-main{
      font-size:1.35rem;
      font-weight:700;
    }
    .title-sub{
      font-size:.85rem;
      color:var(--muted);
    }

    .btn{
      border-radius:999px;
      border:1px solid var(--border);
      padding:7px 14px;
      font-size:.8rem;
      cursor:pointer;
      background:#ffffff;
      color:#111827;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:background .15s, box-shadow .15s, transform .05s;
      text-decoration:none;
    }
    .btn:hover{
      background:#f3faf7;
      box-shadow:0 4px 12px rgba(15,23,42,0.12);
    }
    .btn:active{
      transform:translateY(1px);
      box-shadow:none;
    }
    .btn-primary{
      background:var(--primary);
      border-color:var(--primary);
      color:#ffffff;
    }
    .btn-primary:hover{
      background:var(--primary-dark);
    }
    .btn[disabled]{
      opacity:.55;
      cursor:default;
      box-shadow:none;
    }

    .content{
      border-radius:20px;
      border:1px solid var(--border);
      padding:18px 16px 18px;
      background:rgba(250,250,250,0.9);
    }

    .section-title{
      font-size:.95rem;
      font-weight:600;
      margin-bottom:4px;
    }
    .section-caption{
      font-size:.8rem;
      color:var(--muted);
      margin-bottom:12px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      width:100%;         
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:.85rem;
    }
    .form-label{
      font-weight:500;
    }
    .form-hint{
      font-size:.75rem;
      color:var(--muted);
    }
    input{
      border-radius:10px;
      border:1px solid var(--border);
      padding:7px 10px;
      font-size:.85rem;
      font-family:inherit;
      outline:none;
      background:#ffffff;
      min-height:34px;
    }
    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 1px rgba(25,195,125,0.4);
    }

    select{
      border-radius:10px;
      border:1px solid var(--border);
      padding:7px 10px;
      font-size:.85rem;
      font-family:inherit;
      outline:none;
      background:#ffffff;
      min-height:34px;
      padding-right:200px; 
    }
    select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 1px rgba(25,195,125,0.4);
    }

    .select-wrapper{
      position:relative;
      width:50px;
    }

    .separator{
      margin:14px 0 10px;
      height:1px;
      background:linear-gradient(
        to right,
        rgba(25,195,125,0.15),
        rgba(25,195,125,0.45),
        rgba(25,195,125,0.15)
      );
      border-radius:2px;
    }

    .toggle-bottom{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .toggle-status{
      font-size:.8rem;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .toggle-status-yes{
      color:var(--primary-dark);
      font-weight:600;
    }

    .toggle-status-no{
      color:var(--muted);
      font-weight:500;
    }

    .switch{
      position:relative;
      display:inline-block;
      width:38px;
      height:22px;
    }
    .switch input{
      opacity:0;
      width:0;
      height:0;
    }
    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background:#e5e7eb;
      border-radius:999px;
      transition:.2s;
    }
    .slider:before{
      content:"";
      position:absolute;
      height:18px;
      width:18px;
      left:2px;
      top:2px;
      background:white;
      border-radius:50%;
      box-shadow:0 1px 3px rgba(15,23,42,0.25);
      transition:.2s;
    }
    .switch input:checked + .slider{
      background:var(--primary);
    }
    .switch input:checked + .slider:before{
      transform:translateX(14px);
    }

    .btn-row{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:16px;
      flex-wrap:wrap;
      width:100%;         
    }
   
    .status-text{
      margin-top:8px;
      font-size:.8rem;
      color:var(--muted);
      width:100%;      
    }

    .status-text.ok{
      color:var(--primary-dark);
      font-weight:500;
    }
    .status-text.err{
      color:#b91c1c;
      font-weight:500;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <rect x="8" y="8" width="48" height="48" rx="14" fill="#22c55e"/>
              <rect x="20" y="20" width="24" height="24" rx="6" fill="#f9fafb"/>
              <rect x="24" y="24" width="16" height="16" rx="3" fill="#22c55e"/>
              <path d="M32 19 L28 15 L30 15 L30 11 L34 11 L34 15 L36 15 Z"
                    fill="#bbf7d0" opacity="0.9"/>
              <path d="M32 45 L36 49 L34 49 L34 53 L30 53 L30 49 L28 49 Z"
                    fill="#bbf7d0" opacity="0.9"/>
              <rect x="14" y="26" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="14" y="34" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="46" y="26" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="46" y="34" width="4" height="4" rx="1" fill="#bbf7d0"/>
            </svg>
          </div>
          <div class="title">
            <div class="title-main">STM32 OTA</div>
            <div class="title-sub">Device Settings</div>
          </div>
        </div>

        <a href="/" class="btn">
          ← Back
        </a>
      </div>

      <div class="content">
        <div class="section-title">Device configuration</div>
        <div class="section-caption">
          Set the device name and Access Point password used by the ESP32.
        </div>

        <form id="settingsForm">
          <div class="form-grid">
            <!-- Device name -->
            <div class="form-group">
              <label class="form-label" for="deviceName">Device name</label>
              <input id="deviceName" name="deviceName" type="text" placeholder="e.g. STM32-Bridge-01">
              <div class="form-hint">Name that appears on the UI or Hotspot (Access Point).</div>
            </div>

            <!-- AP Password -->
            <div class="form-group">
              <label class="form-label" for="apPass">Access Point password</label>
              <input id="apPass" name="apPass" type="password" placeholder="min. 8 characters">
              <div class="form-hint">Wi-Fi password for the ESP32 Access Point.</div>
            </div>
          </div>

          <div class="separator"></div>

          <!-- Auto power off settings -->
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="autoOffMinutes">Turn off the ESP32 after (minutes)</label>
              <div class="select-wrapper">
                <select id="autoOffMinutes" name="autoOffMinutes">
                  <option value="1">1 minute</option>
                  <option value="2">2 minutes</option>
                  <option value="3">3 minutes</option>
                  <option value="4">4 minutes</option>
                  <option value="5">5 minutes</option>
                  <option value="6">6 minutes</option>
                  <option value="7">7 minutes</option>
                  <option value="8">8 minutes</option>
                  <option value="9">9 minutes</option>
                  <option value="10">10 minutes</option>
                </select>
              </div>
              <div class="form-hint">Turns off the ESP32 after several minutes of inactivity.</div>
            </div>

            <div class="form-group">
              <label class="form-label">Automatically power down the ESP32 after a successful flash</label>

              <div class="toggle-bottom">
                <label class="switch">
                  <input type="checkbox" id="autoOffOnSuccess" name="autoOffOnSuccess">
                  <span class="slider"></span>
                </label>

                <span id="autoOffStatus" class="toggle-status toggle-status-no">NO</span>
              </div>
            </div>
          </div>


          <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="btnSave">Save settings</button>
          </div>

          <div class="status-text" id="statusText"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const form       = document.getElementById('settingsForm');
    const statusText = document.getElementById('statusText');
    const btnSave    = document.getElementById('btnSave');
    const autoOffCheckbox = document.getElementById('autoOffOnSuccess');
    const autoOffStatus   = document.getElementById('autoOffStatus');

    function setStatus(msg, type){
      statusText.textContent = msg || '';
      statusText.classList.remove('ok','err');
      if(type) statusText.classList.add(type);
    }

    function updateAutoOffStatus(){
      if(!autoOffStatus) return;
      if(autoOffCheckbox.checked){
        autoOffStatus.textContent = 'YES';
        autoOffStatus.classList.add('toggle-status-yes');
        autoOffStatus.classList.remove('toggle-status-no');
      }else{
        autoOffStatus.textContent = 'NO';
        autoOffStatus.classList.add('toggle-status-no');
        autoOffStatus.classList.remove('toggle-status-yes');
      }
    }

    async function loadSettings(){
      try{
        const resp = await fetch('/settings');
        if(!resp.ok) return;
        const data = await resp.json();

        if(data.deviceName) document.getElementById('deviceName').value = data.deviceName;
        if(data.apPass)     document.getElementById('apPass').value     = data.apPass;

        if(data.autoOffMinutes !== undefined){
          document.getElementById('autoOffMinutes').value = data.autoOffMinutes;
        }
        if(data.autoOffOnSuccess !== undefined){
          autoOffCheckbox.checked = data.autoOffOnSuccess;
        }
        updateAutoOffStatus();
      }catch(e){
        console.log('Failed to load settings:', e);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('Saving settings…', null);
      btnSave.disabled = true;

      const payload = {
        deviceName:       document.getElementById('deviceName').value,
        apPass:           document.getElementById('apPass').value,
        autoOffMinutes:   document.getElementById('autoOffMinutes').value,
        autoOffOnSuccess: autoOffCheckbox.checked
      };

      try {
        const resp = await fetch('/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        const txt = await resp.text();
        if(resp.ok){
          setStatus(txt || 'Settings saved successfully. Please restart the ESP32 to see changes.', 'ok');
        }else{
          setStatus(txt || 'Failed to save settings.', 'err');
        }
      }catch(err){
        console.error(err);
        setStatus('Error while saving settings.', 'err');
      }finally{
        btnSave.disabled = false;
      }
    });

    autoOffCheckbox.addEventListener('change', updateAutoOffStatus);

    loadSettings();
  </script>
</body>
</html>

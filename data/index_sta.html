<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>STM32 OTA via ESP32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{
      --primary:#19c37d;
      --primary-dark:#12a164;
      --primary-soft:#d9fbe9;
      --border:#d1d5db;
      --bg:#e5e7eb;
      --card-bg:rgba(255,255,255,0.86);
      --text:#0f172a;
      --muted:#6b7280;
      --danger:#ef4444;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top left,#e0fbea 0,#e0f2fe 40%,#e5e7eb 100%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 12px;
    }

    .card{
      width:100%;
      max-width:780px;
      background:var(--card-bg);
      border-radius:26px;
      box-shadow:
        0 28px 80px rgba(15,23,42,0.35),
        0 0 0 1px rgba(148,163,184,0.35);
      padding:26px 26px 22px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius:14px;
      padding:4px;
      background:radial-gradient(circle at 30% 20%,#bbf7d0,#16a34a);
      box-shadow:
        0 10px 24px rgba(22,163,74,0.45),
        0 0 0 1px rgba(22,163,74,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo svg{
      width:30px;
      height:30px;
      display:block;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title-main{
      font-size:1.35rem;
      font-weight:700;
    }
    .title-sub{
      font-size:.85rem;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(0,0.9fr);
      gap:18px;
    }
    @media(max-width:768px){
      .card{ padding:22px 18px 18px; }
      .grid{ grid-template-columns:1fr; }
    }

    .panel{
      border-radius:20px;
      border:1px solid var(--border);
      padding:14px 14px 16px;
      background:rgba(250,250,250,0.9);
    }

    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      min-height:40px;
      margin-bottom:10px;
    }
    .panel-title{
      font-size:.95rem;
      font-weight:600;
    }
    .panel-caption{
      font-size:.78rem;
      color:var(--muted);
      margin-top:2px;
    }

    .fw-info-card{
      margin-top:8px;
      margin-bottom:16px;
      border-radius:22px;
      background:linear-gradient(145deg,#f9fafb,#eef2ff);
      padding:20px 22px;
      min-height:100px;
      box-shadow:
        inset 0 0 0 1px rgba(148,163,184,0.32),
        0 14px 30px rgba(15,23,42,0.06);
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .fw-info-row{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .fw-info-header{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.82rem;
      color:var(--muted);
    }
    .fw-info-label{
      color:inherit;
    }
    .fw-info-value{
      font-weight:600;
      color:var(--text);
      font-size:1.1rem;
      letter-spacing:0.02em;
    }
    .fw-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#d1d5db;
      box-shadow:0 0 0 3px rgba(209,213,219,0.6);
    }
    .fw-dot-available{
      background:var(--primary);
      box-shadow:0 0 0 3px rgba(34,197,94,0.35);
    }
    .fw-separator{
      height:1px;
      background:linear-gradient(90deg,transparent,#d1d5db,transparent);
      opacity:.9;
    }

    .progress-wrap{
      margin-bottom:12px;
    }
    .progress-bg{
      width:100%;
      height:8px;
      border-radius:999px;
      background:#e5e7eb;
      overflow:hidden;
    }
    .progress-fill{
      width:0%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--primary),#4ade80);
      transition:width .2s ease-out;
    }
    .progress-label{
      display:flex;
      justify-content:space-between;
      font-size:.75rem;
      color:var(--muted);
      margin-top:4px;
    }

    .btn-row{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .btn{
      border-radius:999px;
      border:1px solid var(--border);
      padding:7px 14px;
      font-size:.8rem;
      cursor:pointer;
      background:#ffffff;
      color:#111827;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:background .15s, box-shadow .15s, transform .05s;
    }
    .btn:hover{
      background:#f3faf7;
      box-shadow:0 4px 12px rgba(15,23,42,0.12);
    }
    .btn:active{
      transform:translateY(1px);
      box-shadow:none;
    }
    .btn-primary{
      background:var(--primary);
      border-color:var(--primary);
      color:#ffffff;
    }
    .btn-primary:hover{
      background:var(--primary-dark);
    }
    .btn[disabled]{
      opacity:.55;
      cursor:default;
      box-shadow:none;
    }
    .btn-ghost-green{
      border-color: var(--primary);
      color: var(--primary-dark);
      background:#ffffff;
    }
    .btn-ghost-green:hover{
      background:#ecfdf3;
    }
    .btn-full{
      width:100%;
      justify-content:center;
      padding:10px 16px;
      font-size:.9rem;
      margin-top:6px;
    }

    #log{
      white-space:pre-wrap;
      background:#f9fafb;
      padding:10px;
      height:260px;
      overflow:auto;
      border-radius:12px;
      border:1px solid var(--border);
      font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:.78rem;
      color:#111827;
    }
    .log-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:6px;
      font-size:.8rem;
      color:var(--muted);
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:4px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      font-size:.78rem;
      font-weight:500;
      color:var(--muted);
      background:#ffffff;
      white-space:nowrap;
      min-width:110px;
      box-shadow:0 1px 2px rgba(15,23,42,0.04);
      box-sizing:border-box;
    }
    .status-pill.running{
      border-color:rgba(234,179,8,0.9);
      color:#b45309;
      background:#fefce8;
    }
    .status-pill.ok{
      border-color:rgba(25,195,125,0.9);
      color:var(--primary-dark);
      background:#ecfdf3;
    }
    .status-pill.err{
      border-color:#fca5a5;
      color:#b91c1c;
      background:#fef2f2;
    }

    .footer-note{
      margin-top:14px;
      font-size:.78rem;
      color:var(--muted);
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <rect x="8" y="8" width="48" height="48" rx="14" fill="#22c55e"/>
              <rect x="20" y="20" width="24" height="24" rx="6" fill="#f9fafb"/>
              <rect x="24" y="24" width="16" height="16" rx="3" fill="#22c55e"/>
              <path d="M32 19 L28 15 L30 15 L30 11 L34 11 L34 15 L36 15 Z"
                    fill="#bbf7d0" opacity="0.9"/>
              <path d="M32 45 L36 49 L34 49 L34 53 L30 53 L30 49 L28 49 Z"
                    fill="#bbf7d0" opacity="0.9"/>
              <rect x="14" y="26" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="14" y="34" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="46" y="26" width="4" height="4" rx="1" fill="#bbf7d0"/>
              <rect x="46" y="34" width="4" height="4" rx="1" fill="#bbf7d0"/>
            </svg>
          </div>

          <div class="title">
            <div class="title-main">STM32 OTA</div>
            <div class="title-sub">Firmware update via ESP32 Wi-Fi bridge</div>
          </div>
        </div>

        <button class="btn btn-ghost-green" id="btnSetting">Settings</button>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">Download firmware</div>
              <div class="panel-caption">ESP32 will download &amp; flash the latest firmware</div>
            </div>
          </div>

          <div class="fw-info-card">
            <div class="fw-info-row">
              <div class="fw-info-header">
                <span class="fw-dot fw-dot-available"></span>
                <span class="fw-info-label">Available firmware</span>
              </div>
              <div class="fw-info-value" id="availableFw">–</div>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-bg">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-label">
              <span id="progressText">Idle</span>
              <span id="progressPercent">0%</span>
            </div>
          </div>

          <button class="btn btn-primary btn-full" id="btnUpdate">Update firmware</button>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">Activity log</div>
              <div class="panel-caption">Messages from ESP32 &amp; bootloader</div>
            </div>
            <div class="status-pill" id="statusChip">Idle</div>
          </div>

          <div class="log-head">
            <span>Log output</span>
            <button class="btn" id="btnClear" style="padding:4px 10px;font-size:.75rem;">Clear</button>
          </div>
          <div id="log"></div>
        </div>
      </div>

      <div class="footer-note">
        STM32 Firmware OTA • Use only on trusted networks. Do not power off during update.
      </div>
    </div>
  </div>

  <script>
    const logEl          = document.getElementById('log');
    const statusChip     = document.getElementById('statusChip');
    const progressFill   = document.getElementById('progressFill');
    const progressText   = document.getElementById('progressText');
    const progressPercent= document.getElementById('progressPercent');
    const availableFwEl  = document.getElementById('availableFw');

    let flashStatusTimer = null;

    var logEventSource = new EventSource('/log_events');
    logEventSource.onmessage = function(e) {
      addLog(e.data);
    };

    function addLog(msg){
      const now = new Date();
      const ts = now.toLocaleTimeString();
      const line = document.createElement('div');
      line.textContent = `[${ts}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatusChip(state, text){
      statusChip.textContent = text;
      statusChip.className = 'status-pill';

      if (state === 'ok') {
        statusChip.classList.add('ok');
      } else if (state === 'err') {
        statusChip.classList.add('err');
      } else if (state === 'running') {
        statusChip.classList.add('running');
      }
    }

    function setProgress(percent, label){
      if (percent < 0) percent = 0;
      if (percent > 100) percent = 100;
      progressFill.style.width   = percent + '%';
      progressPercent.textContent= percent + '%';
      if (label) progressText.textContent = label;
    }

    function updateFwInfoFromStatus(st){
      if(st.latest_version) availableFwEl.textContent = st.latest_version;
    }

    async function pollFlashStatus() {
      try {
        const resp = await fetch('/flash_status');
        if (!resp.ok) return;
        const st = await resp.json();

        const pct = typeof st.percent === 'number' ? st.percent : 0;

        if (st.running) {
          setProgress(pct, 'Updating…');
          setStatusChip('running', 'Updating');
        }

        if (st.done) {
          if (flashStatusTimer) {
            clearInterval(flashStatusTimer);
            flashStatusTimer = null;
          }

          if (st.success) {
            setProgress(100, 'Update finished');
            setStatusChip('ok', 'Done');
            addLog('Flashing finished successfully.');
          } else {
            setStatusChip('err', 'Update error');
            setProgress(pct, 'Update error');
            addLog('Flashing failed.');
          }
        }
      } catch (e) {
        addLog('Status poll error: ' + e);
      }
    }

    document.getElementById('btnUpdate').addEventListener('click', async () => {
      addLog('Requesting firmware update…');
      setStatusChip('running', 'Updating');
      setProgress(0, 'Preparing…');

      try {
        const resp_fw = await fetch('/check_firmware');
        if (resp_fw.ok) {
          const st = await resp_fw.json();
          updateFwInfoFromStatus(st);
        }

        const resp = await fetch('/flash', { method: 'POST' });
        const txt  = await resp.text();

        addLog(`Start response: ${resp.status} ${txt}`);

        if (!resp.ok) {
          setStatusChip('err', 'Update error');
          setProgress(0, 'Idle');
          return;
        }

        if (flashStatusTimer) {
          clearInterval(flashStatusTimer);
        }
        flashStatusTimer = setInterval(pollFlashStatus, 500);

      } catch (e) {
        addLog('Start update error: ' + e);
        setStatusChip('err', 'Update error');
        setProgress(0, 'Idle');
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      logEl.textContent = '';
    });

    document.getElementById('btnSetting').addEventListener('click', () => {
      window.location.href = 'setting.html';
    });

    addLog('STM32 OTA UI loaded.');

    (async () => {
      try {
        const resp = await fetch('/check_firmware');
        if (resp.ok) {
          const st = await resp.json();
          updateFwInfoFromStatus(st);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
